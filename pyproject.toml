[project]
name = "stemdeck"
version = "0.3.0-alpha.1"
description = "Paste a YouTube URL, get audio stems split into a DAW-style player."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "yt-dlp>=2024.12.0",
    "demucs>=4.0.1",
    "ml_collections>=0.1.1",
    "omegaconf>=2.2",
    "PyYAML>=6.0",
    "tqdm>=4.66",
    "einops>=0.8.1",
    "beartype>=0.14.1",
    "rotary_embedding_torch>=0.3.5",
    "packaging>=24.0",
    "safetensors>=0.4",
    # CUDA 13.0 wheels are required for Blackwell GPUs (sm_120). uv sources
    # below restrict the PyTorch index to torch/torchaudio only.
    "torch==2.10.0",
    "torchaudio==2.10.0",
    # torchaudio 2.7+ routes save() through TorchCodec; demucs still calls
    # torchaudio.save() when writing stems.
    "torchcodec>=0.10,<0.11",
    # soundfile is still used by the residual allocator/librosa path.
    "soundfile>=0.12",
    # BPM + key analysis on the downloaded source. Pulls numpy/scipy/numba.
    "librosa>=0.10",
    # ITU-R BS.1770 integrated-loudness (LUFS) measurement for the
    # post-analysis loudness card. Pure Python, depends on scipy which
    # librosa already pulls in.
    "pyloudnorm>=0.1.1",
    # FastAPI multipart/form-data (file uploads) unconditionally require
    # python-multipart — it is not an optional extra.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["jobs", ".run", "static/vendor", "vendor/Residual-Allocator"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long -- format-check is the gate, not lint
    "B008",   # FastAPI uses Depends(...) in defaults
    "SIM105", # try/except/pass is fine; contextlib.suppress is heavier for one-shot warm-up imports
]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
